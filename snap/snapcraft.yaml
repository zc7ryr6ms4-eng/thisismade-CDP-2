# thisismade cdp-2 – Snap nur für Wayland (keine X11-Schnittstelle).
#
# Entspricht der GNOME-Erweiterung von Snapcraft (gnome-46-2404, gpu-2404), aber
# ausgeschrieben, damit die x11-Schnittstelle und die X11-Layouts entfallen.
# GTK4 wird fest auf das Wayland-Backend gestellt (GDK_BACKEND=wayland).
name: thisismade-cdp-2
base: core24
version: '1.0.0'
title: thisismade cdp-2
summary: CD player software with tempo, key lock, memory cues and shuttle
description: |
  A music player for GNOME that works like a professional CD deck: a spinning
  disc you can scratch, a display with level meter, tempo fader with key lock,
  three memory cues, shuttle search, direct track entry, repeat and shuffle.
  Plays folders, files, playlists and audio CDs and integrates with the GNOME
  media controls (MPRIS). This snap runs on Wayland only (no X11).
license: BSD-3-Clause
icon: data/io.github.thisismade.cdp2.svg
grade: stable
confinement: strict
assumes:
  - snapd2.43

apps:
  thisismade-cdp-2:
    command: usr/bin/thisismade-cdp-2
    common-id: io.github.thisismade.cdp2
    desktop: usr/share/applications/io.github.thisismade.cdp2.desktop
    command-chain:
      - snap/command-chain/gpu-2404-wrapper
      - snap/command-chain/desktop-launch
    plugs:
      - wayland
      - desktop
      - desktop-legacy
      - gsettings
      - opengl
      - home
      - removable-media
      - audio-playback
      - optical-drive
      - network
    slots:
      - mpris
    environment:
      GDK_BACKEND: wayland
      PYTHONPATH: $SNAP/usr/share/thisismade-cdp-2:$SNAP/usr/lib/python3/dist-packages
      GST_PLUGIN_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gstreamer-1.0

hooks:
  configure:
    command-chain:
      - snap/command-chain/hooks-configure-fonts
    plugs:
      - desktop

environment:
  SNAP_DESKTOP_RUNTIME: $SNAP/gnome-platform
  GTK_USE_PORTAL: '1'

plugs:
  gnome-46-2404:
    interface: content
    target: $SNAP/gnome-platform
    default-provider: gnome-46-2404
  gpu-2404:
    interface: content
    target: $SNAP/gpu-2404
    default-provider: mesa-2404
  desktop:
    mount-host-font-cache: false
  gtk-3-themes:
    interface: content
    target: $SNAP/data-dir/themes
    default-provider: gtk-common-themes
  icon-themes:
    interface: content
    target: $SNAP/data-dir/icons
    default-provider: gtk-common-themes
  sound-themes:
    interface: content
    target: $SNAP/data-dir/sounds
    default-provider: gtk-common-themes

slots:
  mpris:
    interface: mpris
    name: thisismade_cdp2

layout:
  /usr/share/libdrm:
    bind: $SNAP/gpu-2404/libdrm
  /usr/share/drirc.d:
    symlink: $SNAP/gpu-2404/drirc.d
  /usr/lib/x86_64-linux-gnu/libproxy:
    bind: $SNAP/gnome-platform/usr/lib/x86_64-linux-gnu/libproxy
  /usr/share/xml/iso-codes:
    bind: $SNAP/gnome-platform/usr/share/xml/iso-codes

parts:
  app:
    plugin: dump
    source: .
    organize:
      tmplayer: usr/share/thisismade-cdp-2/tmplayer
      data/thisismade-cdp-2: usr/bin/thisismade-cdp-2
      data/io.github.thisismade.cdp2.desktop: usr/share/applications/io.github.thisismade.cdp2.desktop
      data/io.github.thisismade.cdp2.svg: usr/share/icons/hicolor/scalable/apps/io.github.thisismade.cdp2.svg
      data/io.github.thisismade.cdp2.metainfo.xml: usr/share/metainfo/io.github.thisismade.cdp2.metainfo.xml
    stage:
      - usr
    stage-packages:
      - python3-gi
      - python3-gi-cairo
      - python3-cairo
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-libav
      - gstreamer1.0-pulseaudio

  # Startskripte der GNOME-Laufzeit (aus Snapcraft, wie die GNOME-Erweiterung)
  gnome-sdk:
    source: /snap/snapcraft/current/share/snapcraft/extensions/desktop/command-chain
    plugin: make
    build-snaps:
      - gnome-46-2404-sdk

  gpu-wrapper:
    source: /snap/snapcraft/current/share/snapcraft/extensions/gpu/command-chain
    plugin: make
    make-parameters:
      - GPU_INTERFACE=gpu-2404

  gpu-cleanup:
    after: [app]
    source: https://github.com/canonical/gpu-snap.git
    plugin: nil
    override-prime: |-
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
      mkdir -p "${CRAFT_PRIME}/gpu-2404"
